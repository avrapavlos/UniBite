<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../css/auth/register.css">

    <title>Register</title>
</head>


<body>

    <div class="register-page">


        <div class="register-container">


            <!-- Logo -->
            <div class="logo-section">

                <div class="logo-icon">

                    <img class="logo-icon-image" src="../../images/logo/logo.png">

                </div>


                <h1>UniBite</h1>

                <p>
                    Fresh food. Smart choices.
                </p>

            </div>



            <!-- Register Form -->

            <form class="register-form" id="register-form">


                <h2>
                    Create Account
                </h2>

                <!--Error messgae-->
                <p class="password-error" id="password-error">
                    Passwords didn't match! 
                </p>

                <p class="duplicate-name-email" id="duplicate-name-email">
                    Name or Email already exist!
                </p>

                <!-- Name -->

                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>


                    <input type="text" id="name" name="name" placeholder="John Smith" required>

                </div>




                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        University Email
                    </label>


                    <input type="email" id="email" name="email" placeholder="student@university.com" required>

                </div>




                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>


                    <input type="password" id="password" name="password" placeholder="Create a password" required>

                </div>




                <!-- Confirm Password -->

                <div class="input-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>


                    <input type="password" id="confirm-password" name="confirm-password"
                        placeholder="Repeat your password" required>

                </div>




                <!-- Terms -->

                <div class="terms">


                    <label>

                        <input type="checkbox" required>

                        I agree to the
                        <a href="#">
                            Terms and Conditions
                        </a>

                    </label>


                </div>




                <!-- Button -->

                <button type="submit">

                    Create Account

                </button>




                <!-- Login -->

                <p class="login">

                    Already have an account?

                    <a href="../auth/login.html">
                        Login
                    </a>

                </p>



            </form>


        </div>


    </div>



    <script type="module" src="../../js/pages/auth/registerPage.js"></script>


</body>

</html>
