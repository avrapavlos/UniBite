<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/auth/login.css">
    <title>Document</title>
</head>

<body>
    <div class="login-page">

        <div class="login-container">

            <!-- Logo -->
            <div class="logo-section">
                <div class="logo-icon">
                    <img class="logo-icon-image" src="../../images/logo/logo.png">
                </div>

                <h1>UniBite</h1>
                <p>Fresh food. Smart choices.</p>
            </div>


            <!-- Login Form -->
            <form class="login-form" id="login-form">

                <h2>Welcome Back!</h2> 

                <div class="input-group">
                    <label for="email">
                        Email
                    </label>

                    <input 
                    type="email" 
                    id="email" 
                    name="email"
                    placeholder="student@university.com" 
                    required>
                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input 
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password" required>

                </div>


                <div class="options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button type="submit">
                    Login
                </button>


                <p class="register">
                    Don't have an account?
                    <a href="#">
                        Sign up
                    </a>
                </p>


            </form>

        </div>

    </div>

    <script type="module" src="../../js/pages/loginPage.js"></script>
</body>

</html>
